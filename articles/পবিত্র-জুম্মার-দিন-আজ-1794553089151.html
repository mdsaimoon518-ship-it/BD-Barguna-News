<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>পবিত্র জুম্মার দিন আজ | BD Barguna News</title><link rel="canonical" href="https://mdsaimoon518-ship-it.github.io/BD-Barguna-News/articles/%E0%A6%AA%E0%A6%AC%E0%A6%BF%E0%A6%A4%E0%A7%8D%E0%A6%B0-%E0%A6%9C%E0%A7%81%E0%A6%AE%E0%A7%8D%E0%A6%AE%E0%A6%BE%E0%A6%B0-%E0%A6%A6%E0%A6%BF%E0%A6%A8-%E0%A6%86%E0%A6%9C-1794553089151.html"><style>body{margin:0;padding:14px;background:#f1f3f6;font-family:Arial;line-height:1.8}.paper{max-width:850px;margin:auto;background:white;padding:22px;border-radius:12px}.brand{color:#b5122b;font-size:23px;font-weight:bold;border-bottom:3px solid #b5122b;padding:12px 0}.category{color:#b5122b}h1{line-height:1.5}.body{white-space:pre-wrap;text-align:justify}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.actions button{padding:10px;border:0;border-radius:6px;background:#b5122b;color:white}.actions .blue{background:#175cd3}.actions .green{background:#128c4a}</style></head><body><main class="paper"><div class="brand">BD Barguna News</div><p class="category">বরগুনা</p><h1>পবিত্র জুম্মার দিন আজ</h1><p>📅 প্রকাশিত: ১৩ নভেম্বর, ২০২৬ এ ১২:৫৮ PM</p><img id="newsImage" style="width:100%;max-height:500px;object-fit:contain" src="../images/news/news-1794553085599.jpg" alt="পবিত্র জুম্মার দিন আজ"><article class="body">আজকের জুম্মার দিন গরীব মানুষের জন্য হজ্জ এর সমান এই দিনটি</article><footer>সত্যের সন্ধানে, মানুষের পাশে।</footer><style>#bd-bn-tools{margin:26px 0;padding:16px;border:1px solid #dbe2ea;border-radius:14px;background:#f8fafc}#bd-bn-tools h2{margin:0 0 12px;color:#b5122b;font-size:21px}#bd-bn-tools .bn-grid{display:flex;flex-wrap:wrap;gap:8px}#bd-bn-tools button{border:0;border-radius:8px;padding:11px 14px;background:#087b42;color:#fff;font-weight:700}#bd-bn-tools button.alt{background:#344054}#bd-bn-tools button.fb{background:#1877f2}#bd-bn-tools button.wa{background:#128c4a}#bd-bn-tools button.yt{background:#d92d20}#bd-bn-tools img{display:block;width:100%;max-width:520px;margin:12px auto;border-radius:10px}</style><section id="bd-bn-tools"><h2>🖼️ BD Barguna News — ফটোকার্ড ও শেয়ার</h2><img id="bd-bn-card-preview" alt="ফটোকার্ড" hidden><div class="bn-grid"><button onclick="bdBnDownload()">ফটোকার্ড ডাউনলোড</button><button class="alt" onclick="bdBnPrintCard()">ফটোকার্ড প্রিন্ট</button><button class="alt" onclick="bdBnCopyCard()">ফটোকার্ড কপি</button><button class="alt" onclick="window.print()">সংবাদ প্রিন্ট / PDF</button><button class="alt" onclick="bdBnCopyText()">নিউজ কপি</button><button class="alt" onclick="bdBnCopyLink()">লিংক কপি</button><button class="fb" onclick="bdBnShare('fb')">Facebook শেয়ার</button><button class="wa" onclick="bdBnShare('wa')">WhatsApp শেয়ার</button><button class="yt" onclick="bdBnShare('yt')">YouTube</button></div><p id="bd-bn-status">ফটোকার্ড প্রস্তুত হচ্ছে…</p></section><script>(function(){var title=(document.querySelector('h1')?.textContent||document.title).trim(),body=(document.querySelector('article,.body,.article')?.textContent||'').trim(),im=document.querySelector('#newsImage,.photo-card img,.article-image,figure img,main img'),date=(document.querySelector('.date')?.textContent||new Date().toLocaleDateString('bn-BD')).trim(),cv;function make(){if(cv)return cv;cv=document.createElement('canvas');cv.width=cv.height=1200;var c=cv.getContext('2d');c.fillStyle='#142238';c.fillRect(0,0,1200,1200);c.fillStyle='#b5122b';c.fillRect(0,0,1200,16);c.fillStyle='white';c.font='bold 40px Arial';c.fillText('BD BARGUNA NEWS',55,90);c.font='24px Arial';c.fillText('সত্যের সন্ধানে, মানুষের পাশে।',55,130);c.fillStyle='#fff';c.fillRect(45,165,1110,650);if(im&&im.complete&&im.naturalWidth){var sc=Math.max(1110/im.naturalWidth,650/im.naturalHeight),sw=1110/sc,sh=650/sc;c.drawImage(im,(im.naturalWidth-sw)/2,(im.naturalHeight-sh)/2,sw,sh,45,165,1110,650)}else{c.fillStyle='#667085';c.font='bold 36px Arial';c.fillText('ছবি পাওয়া যায়নি',420,500)}c.fillStyle='#111827';c.fillRect(45,835,1110,260);c.fillStyle='white';c.font='bold 43px Arial';var line='',y=900;title.split(/\s+/).forEach(w=>{var z=line?line+' '+w:w;if(c.measureText(z).width>1030&&line){if(y<1040)c.fillText(line,80,y);y+=58;line=w}else line=z});if(line&&y<1040)c.fillText(line,80,y);c.fillStyle='#cbd5e1';c.font='24px Arial';c.fillText(date.slice(0,55),80,1145);return cv}window.bdBnDownload=()=>{var a=document.createElement('a');a.href=make().toDataURL('image/png');a.download='BD-Barguna-News-PhotoCard.png';a.click()};window.bdBnPrintCard=()=>{var w=window.open('','_blank');if(!w)return alert('পপ-আপ অনুমতি দিন');w.document.write('<img style="width:100%" src="'+make().toDataURL('image/png')+'" onload="window.print()">');w.document.close()};window.bdBnCopyCard=async()=>{try{var b=await new Promise(r=>make().toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);alert('ফটোকার্ড কপি হয়েছে')}catch(e){alert('ছবি কপি সমর্থিত নয়; ডাউনলোড ব্যবহার করুন')}};window.bdBnCopyText=()=>cp(title+'\n\n'+body+'\n'+location.href);window.bdBnCopyLink=()=>cp(location.href);function cp(t){var x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove();alert('কপি হয়েছে')}window.bdBnShare=k=>{if(k==='fb')open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href));else if(k==='wa')open('https://wa.me/?text='+encodeURIComponent(title+' '+location.href));else{bdBnCopyLink();open('https://www.youtube.com/')}};addEventListener('load',()=>{try{var p=document.getElementById('bd-bn-card-preview');p.src=make().toDataURL('image/png');p.hidden=false;document.getElementById('bd-bn-status').textContent='ফটোকার্ড তৈরি হয়েছে'}catch(e){document.getElementById('bd-bn-status').textContent='ফটোকার্ড তৈরি হয়নি: '+e.message}})})();</script></main><script>function cp(t){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();}function copyArticleText(){var t=document.querySelector("h1").textContent+"\n\n"+document.querySelector(".body").textContent+"\n"+location.href;if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){cp(t)});else cp(t);}function copyArticleLink(){var t=location.href;if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){cp(t)});else cp(t);}function shareFacebook(){window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(location.href),"_blank");}function shareWhatsApp(){window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");}function shareToYouTube(){copyArticleLink();alert("লিংক কপি হয়েছে। YouTube-এ পেস্ট করুন।");window.open("https://www.youtube.com/","_blank");}function card(){var c=document.createElement("canvas"),x=c.getContext("2d");c.width=1200;c.height=1200;x.fillStyle="#fff";x.fillRect(0,0,1200,1200);x.fillStyle="#b5122b";x.fillRect(0,0,1200,130);x.fillStyle="#fff";x.font="bold 48px Arial";x.fillText("BD BARGUNA NEWS",55,85);x.fillStyle="#202936";x.font="bold 48px Arial";var words="পবিত্র জুম্মার দিন আজ".split(" "),line="",y=260;words.forEach(function(w){var z=line?line+" "+w:w;if(x.measureText(z).width>1080){x.fillText(line,60,y);line=w;y+=75;}else line=z;});if(line)x.fillText(line,60,y);x.fillStyle="#667085";x.font="28px Arial";x.fillText("সত্যের সন্ধানে, মানুষের পাশে।",60,1120);return c;}function downloadNewsPhotoCard(){var a=document.createElement("a");a.href=card().toDataURL("image/png");a.download="bd-barguna-news-photo-card.png";a.click();}function printNewsPhotoCard(){var w=window.open("","_blank");if(w){w.document.write("<img style=\"width:100%\" src=\""+card().toDataURL("image/png")+"\" onload=\"window.print()\">");w.document.close();}}function copyNewsPhotoCard(){alert("ফটোকার্ড ডাউনলোড করে শেয়ার করুন।");}</script></body></html>
