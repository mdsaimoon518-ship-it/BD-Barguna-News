="body">আজকের জুম্মার দিন গরীব মানুষের জন্য হজ্জ এর সমান এই দিনটি</article><footer>সত্যের সন্ধানে, মানুষের পাশে।</footer></main><script>function cp(t){var x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();document.execCommand("copy");x.remove();}function copyArticleText(){var t=document.querySelector("h1").textContent+"\n\n"+document.querySelector(".body").textContent+"\n"+location.href;if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){cp(t)});else cp(t);}function copyArticleLink(){var t=location.href;if(navigator.clipboard)navigator.clipboard.writeText(t).catch(function(){cp(t)});else cp(t);}function shareFacebook(){window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(location.href),"_blank");}function shareWhatsApp(){window.open("https://wa.me/?text="+encodeURIComponent(location.href),"_blank");}function shareToYouTube(){copyArticleLink();alert("লিংক কপি হয়েছে। YouTube-এ পেস্ট করুন।");window.open("https://www.youtube.com/","_blank");}function card(){var c=document.createElement("canvas"),x=c.getContext("2d");c.width=1200;c.height=1200;x.fillStyle="#fff";x.fillRect(0,0,1200,1200);x.fillStyle="#b5122b";x.fillRect(0,0,1200,130);x.fillStyle="#fff";x.font="bold 48px Arial";x.fillText("BD BARGUNA NEWS",55,85);x.fillStyle="#202936";x.font="bold 48px Arial";var words="পবিত্র জুম্মার দিন আজ".split(" "),line="",y=260;words.forEach(function(w){var z=line?line+" "+w:w;if(x.measureText(z).width>1080){x.fillText(line,60,y);line=w;y+=75;}else line=z;});if(line)x.fillText(line,60,y);x.fillStyle="#667085";x.font="28px Arial";x.fillText("সত্যের সন্ধানে, মানুষের পাশে।",60,1120);return c;}function downloadNewsPhotoCard(){var a=document.createElement("a");a.href=card().toDataURL("image/png");a.download="bd-barguna-news-photo-card.png";a.click();}function printNewsPhotoCard(){var w=window.open("","_blank");if(w){w.document.write("<img style=\"width:100%\" src=\""+card().toDataURL("image/png")+"\" onload=\"window.print()\">");w.document.close();}}function copyNewsPhotoCard(){alert("ফটোকার্ড ডাউনলোড করে শেয়ার করুন।");}</script></body></html>
