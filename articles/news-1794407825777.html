function makePhotoCard(){
const title=document.querySelector('.title')?.textContent||'BD Barguna News';
const photo=document.querySelector('.photo, figure img');
const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1080;
const ctx=canvas.getContext('2d');
const bg=ctx.createLinearGradient(0,0,1080,1080);bg.addColorStop(0,'#18212b');bg.addColorStop(1,'#b5122b');ctx.fillStyle=bg;ctx.fillRect(0,0,1080,1080);
ctx.fillStyle='#fff';ctx.font='bold 48px Arial';ctx.fillText('BD BARGUNA NEWS',64,82);
const finish=()=>{
ctx.fillStyle='#fff';ctx.font='bold 54px Arial';let words=title.split(/\s+/),lines=[],line='';
for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>940&&line){lines.push(line);line=w}else line=t}if(line)lines.push(line);
let y=photo&&photo.complete&&photo.naturalWidth?750:390;lines.slice(0,4).forEach(t=>{ctx.fillText(t,64,y);y+=72});
ctx.font='30px Arial';ctx.fillStyle='#ffe3e8';ctx.fillText('বরগুনা ও দেশের সর্বশেষ সংবাদ',64,1015);
canvas.toBlob(blob=>{if(!blob){alert('ফটো কার্ড তৈরি হয়নি।');return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bd-barguna-news-photo-card.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);},'image/png');
};
if(photo&&photo.src){const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{ctx.drawImage(im,64,125,952,560);finish()};im.onerror=finish;im.src=photo.src;}else finish();
}
