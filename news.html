document.getElementById('dynFontUp').onclick=()=>{dynamicFont=Math.min(30,dynamicFont+1);const b=document.querySelector('#article .body');if(b)b.style.fontSize=dynamicFont+'px';};
document.getElementById('dynPrint').onclick=()=>window.print();

const articleKey=safeKey(n.slug||('news_'+index));
const viewsRef=db.ref('articleViews/'+articleKey),likesRef=db.ref('articleLikes/'+articleKey),commentsRef=db.ref('articleComments/'+articleKey);
const likeButton=document.getElementById('articleLike'),status=document.getElementById('readerStatus');
authReady.then(async user=>{
 viewsRef.transaction(value=>(Number(value)||0)+1);
 viewsRef.on('value',snap=>document.getElementById('readerViews').textContent='👁️ পাঠক: '+bnDigits(Number(snap.val())||0));
 likesRef.on('value',snap=>document.getElementById('readerLikes').textContent='❤️ لাইক: '+bnDigits(snap.numChildren()));
 const mine=likesRef.child(user.uid);
 mine.once('value').then(snap=>{if(snap.exists()){likeButton.disabled=true;likeButton.textContent='❤️ লাইক দিয়েছেন';}});
 likeButton.addEventListener('click',async()=>{likeButton.disabled=true;try{const snap=await mine.once('value');if(snap.exists()){status.textContent='আপনি ইতিমধ্যে লাইক দিয়েছেন।';}else{await mine.set(true);likeButton.textContent='❤️ লাইক দিয়েছেন';status.textContent='আপনার লাইক যোগ হয়েছে। ধন্যবাদ!';}}catch(e){likeButton.disabled=false;status.textContent='লাইক যোগ করা যায়নি। Firebase Database Rules পরীক্ষা করুন।';}});
 const form=document.getElementById('readerCommentForm'),submit=document.getElementById('commentSubmit'),list=document.getElementById('commentList'),commentStatus=document.getElementById('commentStatus');
 commentsRef.orderByChild('approved').equalTo(true).limitToLast(40).on('value',snap=>{const rows=[];snap.forEach(child=>rows.push({id:child.key,...child.val()}));rows.reverse();const approvedRows=rows.filter(c=>c.approved===true);list.innerHTML=approvedRows.length?approvedRows.map(c=>'<article class="comment-item"><strong>'+esc(c.name||'পাঠক')+'</strong><p>'+esc(c.text||'')+'</p><time>'+esc(timeLabel(c.createdAt))+'</time></article>').join(''):'<div class="empty">এখনো কোনো মন্তব্য নেই। প্রথম মন্তব্যটি আপনিই করুন।</div>';commentStatus.textContent=approvedRows.length?'অনুমোদিত মন্তব্যগুলো দেখানো হচ্ছে।':'এখনো কোনো অনুমোদিত মন্তব্য নেই।';},e=>{commentStatus.textContent='মন্তব্য লোড হয়নি। Firebase Rules পরীক্ষা করুন।';});
 form.addEventListener('submit',async e=>{e.preventDefault();const name=form.querySelector('#commentName').value.trim().slice(0,40),text=form.querySelector('#commentText').value.trim();if(name.length<2||text.length<3){commentStatus.textContent='নাম ও অন্তত ৩ অক্ষরের মন্তব্য লিখুন।';return;}submit.disabled=true;commentStatus.textContent='মন্তব্য জমা হচ্ছে...';try{await commentsRef.push({name,text:text.slice(0,500),uid:user.uid,createdAt:firebase.database.ServerValue.TIMESTAMP,approved:false});form.querySelector('#commentText').value='';commentStatus.textContent='মন্তব্য জমা হয়েছে। ধন্যবাদ!';}catch(error){commentStatus.textContent='মন্তব্য জমা হয়নি। Firebase Database Rules-এ authenticated write অনুমতি প্রয়োজন।';}finally{submit.disabled=false;}});
}).catch(e=>{status.textContent='পাঠক প্রতিক্রিয়া চালু হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।';});
}).catch(()=>{document.getElementById('article').innerHTML='<div class="empty">সংবাদটি পাওয়া যায়নি। <a class="back" href="./">প্রচ্ছদে ফিরে যান</a></div>'});
</script></body></html>
