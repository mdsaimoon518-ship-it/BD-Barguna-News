<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b5122b">
<title>ই-পেপার | BD Barguna News</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#171717;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.65}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;justify-content:center;align-items:center;padding:12px;background:#18212b;color:white}
.toolbar button,.toolbar a{border:0;border-radius:6px;padding:10px 16px;background:#b5122b;color:white;font-weight:700;text-decoration:none}
#status{max-width:1100px;margin:12px auto;padding:10px 16px;color:#475569}
.paper{max-width:1100px;margin:14px auto;background:#fff;padding:24px;box-shadow:0 3px 18px #0001}
.masthead{text-align:center;border-bottom:4px double #171717;padding-bottom:12px;margin-bottom:18px}
.masthead .topline{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:5px;font-size:12px}
.masthead h1{font-family:Georgia,"Noto Serif Bengali",serif;font-size:clamp(30px,6vw,54px);line-height:1.1;margin:12px 0 4px;color:#a90e27}
.masthead p{margin:0;font-weight:700}.masthead .strap{margin-top:8px;border-top:2px solid #222;padding-top:7px;font-size:13px}
.news-grid{column-count:3;column-gap:22px;column-rule:1px solid #bbb}
.story{break-inside:avoid-column;margin:0 0 18px;padding:0 0 13px;border-bottom:1px solid #888}
.story h2{font-size:22px;line-height:1.3;margin:0 0 5px;color:#171717}
.story .meta{font-size:11px;color:#555;margin-bottom:7px}
.story img{max-width:100%;height:auto;max-height:230px;object-fit:cover;display:block;margin:5px auto}
.story .caption{font-size:10px;color:#555;text-align:center}
.story .body{font-size:13px;line-height:1.55;text-align:justify;white-space:pre-wrap;overflow-wrap:anywhere}
.story .category{display:inline-block;font-size:10px;font-weight:700;color:#a90e27;border-bottom:1px solid #a90e27;margin-bottom:4px}
.empty{text-align:center;padding:40px;color:#667085}
@media(max-width:760px){.paper{margin:0;padding:14px}.news-grid{column-count:2;column-gap:14px}.story h2{font-size:18px}}
@media(max-width:480px){.news-grid{column-count:1}.toolbar{position:static;flex-wrap:wrap}}
@media print{
 @page{size:A4 landscape;margin:5mm}
 body{background:white!important}.toolbar,#status{display:none!important}
 .paper{max-width:none;width:100%;margin:0;padding:0;box-shadow:none;transform-origin:top left}
 .masthead{break-after:avoid}.masthead h1{font-size:38pt}
 .news-grid{column-count:4;column-gap:4mm;column-rule:.35pt solid #aaa}
 .story{break-inside:avoid-column;margin-bottom:4mm;padding-bottom:2mm}
 .story h2{font-size:15pt;line-height:1.18}
 .story .body{font-size:8.5pt;line-height:1.35}
 .story .meta,.story .category{font-size:7pt}
 .story img{max-height:45mm}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="toolbar"><a href="./">← প্রচ্ছদ</a><button type="button" onclick="printAllNewsOneSheet()">🖨️ সব নিউজ এক কাগজে প্রিন্ট</button></div>
<div id="status">প্রকাশিত সব সংবাদ সংগ্রহ করা হচ্ছে…</div>
<main class="paper">
<header class="masthead">
<div class="topline"><span>অনলাইন দৈনিক সংবাদপত্র</span><span id="editionDate"></span><span>বরগুনা • বাংলাদেশ</span></div>
<h1>BD BARGUNA NEWS</h1><p>সত্যের সন্ধানে, মানুষের পাশে।</p>
<div class="strap">স্থানীয় • জাতীয় • আন্তর্জাতিক সংবাদ</div>
</header>
<section id="newsGrid" class="news-grid"><div class="empty">সংবাদ লোড হচ্ছে…</div></section>
</main>
<script>
(async function(){
 const status=document.getElementById('status'),grid=document.getElementById('newsGrid');
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 try{
  const sm=await fetch('./sitemap.xml',{cache:'no-store'});if(!sm.ok)throw new Error('সাইটম্যাপ পাওয়া যায়নি');
  const xml=new DOMParser().parseFromString(await sm.text(),'application/xml');
  const urls=[...xml.querySelectorAll('loc')].map(x=>x.textContent.trim()).filter(u=>u.includes('/articles/'));
  const pages=await Promise.all(urls.map(async url=>{try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)return null;const html=await r.text(),doc=new DOMParser().parseFromString(html,'text/html');const title=doc.querySelector('h1')?.textContent?.trim()||doc.title;const body=doc.querySelector('.article,.body')?.textContent?.trim()||'';if(!title||!body)return null;return {url,title,body,category:doc.querySelector('.category')?.textContent?.trim()||'সংবাদ',date:doc.querySelector('.date,.meta')?.textContent?.trim()||'',image:doc.querySelector('.photo-card img,.photo img,.article img')?.getAttribute('src')||'',caption:doc.querySelector('.caption')?.textContent?.trim()||''};}catch(e){return null;}}));
  const items=pages.filter(Boolean);
  if(!items.length)throw new Error('কোনো প্রকাশিত সংবাদ পাওয়া যায়নি');
  items.sort((a,b)=>b.url.localeCompare(a.url));
  grid.innerHTML=items.map(n=>'<article class="story"><span class="category">'+esc(n.category)+'</span><h2>'+esc(n.title)+'</h2><div class="meta">'+esc(n.date)+'</div>'+(n.image?'<img loading="lazy" src="'+esc(new URL(n.image,n.url).href)+'" alt="'+esc(n.title)+'">':'')+(n.caption?'<div class="caption">'+esc(n.caption)+'</div>':'')+'<div class="body">'+esc(n.body)+'</div></article>').join('');
  status.textContent='মোট '+items.length.toLocaleString('bn-BD')+'টি প্রকাশিত সংবাদ — একটি প্রিন্ট কমান্ডে সব সংবাদ একসাথে প্রিন্ট হবে।';
  document.getElementById('editionDate').textContent=new Date().toLocaleDateString('bn-BD',{dateStyle:'long'});
 }catch(e){status.textContent='সংবাদ লোড করা যায়নি: '+e.message;grid.innerHTML='<div class="empty">সাইটম্যাপ বা সংবাদ পেজ লোডে সমস্যা হয়েছে।</div>';}
})();

async function printAllNewsOneSheet(){
 const paper=document.querySelector('.paper');
 const images=[...paper.querySelectorAll('img')];
 await Promise.all(images.map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,5000)})));
 paper.classList.add('one-sheet-print');
 const old=document.getElementById('oneSheetPrintStyle');if(old)old.remove();
 const style=document.createElement('style');style.id='oneSheetPrintStyle';
 style.textContent='@media print{@page{size:A4 landscape;margin:5mm}.paper{width:100%!important;max-width:none!important;margin:0!important;padding:0!important;transform-origin:top left!important}.news-grid{column-count:4!important;column-gap:4mm!important}.story{break-inside:avoid!important}.story h2{font-size:10pt!important}.story .body{font-size:6pt!important;line-height:1.15!important}.story .meta,.story .category{font-size:5pt!important}.story img{max-height:22mm!important}}';
 document.head.appendChild(style);
 const previous=paper.style.transform;
 const h=paper.scrollHeight;const scale=Math.min(1,700/h);paper.style.transform='scale('+scale+')';paper.style.height=(h*scale)+'px';paper.style.overflow='visible';
 window.addEventListener('afterprint',function cleanup(){paper.style.transform=previous;paper.style.height='';paper.style.overflow='';paper.classList.remove('one-sheet-print');style.remove();window.removeEventListener('afterprint',cleanup);},{once:true});
 window.print();
}
</script>
</body></html>
