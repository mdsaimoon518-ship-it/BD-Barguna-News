<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b5122b"><title>BD Barguna News | ই-পেপার</title><meta name="description" content="BD Barguna News-এর আজকের ই-পেপার। সব প্রকাশিত সংবাদ পত্রিকার পাতায় পড়ুন ও PDF করুন।">
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf1;color:#17212b;font-family:Arial,"Noto Sans Bengali",sans-serif}.top{background:#fff;padding:12px 16px;border-bottom:3px solid #a80e28;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(20px,4vw,30px);font-weight:900;color:#a80e28}.sub{font-size:12px;color:#586474}.tools{display:flex;gap:7px;flex-wrap:wrap}.tools button,.tools a{border:0;background:#15536b;color:white;border-radius:5px;padding:9px 12px;text-decoration:none;font-weight:bold;cursor:pointer}.tools button:disabled{opacity:.4}.layout{max-width:1250px;margin:12px auto;display:grid;grid-template-columns:120px minmax(0,1fr) 170px;gap:12px;padding:0 10px}.side{background:#fff;border-radius:8px;padding:9px;max-height:calc(100vh - 110px);overflow:auto}.thumb{display:block;width:100%;border:1px solid #b7c2ca;background:#fff;padding:4px;margin-bottom:8px;text-align:center;cursor:pointer;border-radius:5px}.thumb.active{outline:3px solid #15536b}.thumb small{display:block;background:#15536b;color:white;margin:4px -4px -4px;padding:3px}.sheet{background:#fffdf6;box-shadow:0 2px 12px #0002;padding:22px;min-height:1100px;border:1px solid #c7c7c7}.paper-head{text-align:center;border-bottom:4px double #202020;padding-bottom:8px;margin-bottom:12px}.paper-head .date{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #777;padding-bottom:5px}.paper-head h1{font-family:Georgia,serif;font-size:clamp(27px,4vw,48px);margin:8px 0 2px;color:#111}.paper-head p{margin:0;font-size:12px}.paper-head .line{height:5px;border-top:2px solid #222;border-bottom:1px solid #222;margin-top:8px}.stories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}.story{border-bottom:1px solid #999;padding-bottom:10px;break-inside:avoid;overflow:hidden}.story.lead{grid-column:1/-1;display:grid;grid-template-columns:1.1fr 1fr;gap:12px;border-bottom:3px double #333;padding-bottom:13px}.story h2{font-size:18px;line-height:1.35;margin:0 0 6px;color:#171717}.story.lead h2{font-size:26px}.story .meta{font-size:10px;color:#555;margin-bottom:5px}.story img{width:100%;max-height:190px;object-fit:cover;display:block;margin:4px 0}.story.lead img{max-height:250px}.story p{font-family:"Noto Serif Bengali",serif;font-size:12px;line-height:1.65;text-align:justify;margin:5px 0;white-space:pre-line}.story a{color:inherit;text-decoration:none}.page-foot{border-top:3px double #222;margin-top:18px;padding-top:7px;display:flex;justify-content:space-between;font-size:11px}.ad{border:1px dashed #a9a9a9;padding:14px;text-align:center;color:#555;margin:12px 0;font-size:12px}.right .ad{min-height:110px}.empty{text-align:center;padding:40px;color:#555}
@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:flex;gap:7px;max-height:none;overflow:auto}.thumb{min-width:76px;width:76px;margin:0}.right{display:none}.sheet{padding:13px;min-height:900px}.story h2{font-size:15px}.story.lead h2{font-size:21px}.story p{font-size:11px}}
@media print{@page{size:A4 portrait;margin:9mm}body{background:#fff}.top,.side,.right,.tools{display:none!important}.layout{display:block;max-width:none;margin:0;padding:0}.sheet{box-shadow:none;border:0;padding:0;min-height:0;break-after:page;page-break-after:always}.sheet:last-child{break-after:auto;page-break-after:auto}.story,.paper-head,.page-foot{break-inside:avoid}.story p{font-size:9pt}.story h2{font-size:14pt}.story.lead h2{font-size:20pt}.story img{max-height:55mm;object-fit:contain}.ad{background:#fff}}
</style></head><body>
<header class="top"><div><div class="brand">BD BARGUNA NEWS</div><div class="sub">সত্যের সন্ধানে, মানুষের পাশে। · ই-পেপার</div></div><div class="tools"><a href="./">হোম</a><button id="prev">‹ আগের পাতা</button><button id="next">পরের পাতা ›</button><button onclick="window.print()">🖨️ প্রিন্ট / PDF</button></div></header>
<div class="layout"><aside class="side" id="thumbs" aria-label="সব পাতা"></aside><main id="pages"><div class="empty">সংবাদ লোড হচ্ছে...</div></main><aside class="side right"><strong>বিজ্ঞাপন</strong><div class="ad">বিজ্ঞাপনের জন্য যোগাযোগ করুন<br>BD Barguna News</div><div class="ad">আপনার বিজ্ঞাপন এখানে দিন</div></aside></div>
<script>
const BASE='https://mdsaimoon518-ship-it.github.io/BD-Barguna-News/';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImage=s=>{try{const u=new URL(s,BASE);return /^https?:$/.test(u.protocol)?u.href:''}catch(e){return ''}};
const bn=n=>String(n).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[+d]);
let pages=[],current=0;
function story(n,i){const href=n.slug?'articles/'+encodeURIComponent(n.slug)+'.html':'#';const img=safeImage(n.image||n.imageUrl);const body=String(n.body||n.summary||'').replace(/\n?বিজ্ঞাপন\n?/g,' ').replace(/\s+/g,' ').trim();const lead=i===0;return '<article class="story '+(lead?'lead':'')+'"><div><div class="meta">'+esc(n.category||'সংবাদ')+' · '+esc(n.date?new Date(n.date).toLocaleDateString('bn-BD'):'')+'</div><h2><a href="'+href+'">'+esc(n.title)+'</a></h2><p>'+esc(body.slice(0,lead?950:520))+(body.length>(lead?950:520)?'…':'')+'</p><a href="'+href+'" class="meta">বিস্তারিত পড়ুন →</a></div>'+(img?'<img src="'+esc(img)+'" alt="'+esc(n.title)+'">':'')+'</article>'}
function render(){const root=document.getElementById('pages');const thumbs=document.getElementById('thumbs');if(!pages.length){root.innerHTML='<div class="empty">এখনো কোনো সংবাদ পাওয়া যায়নি।</div>';return;}root.innerHTML=pages.map((items,p)=>'<section class="sheet" data-page="'+p+'" style="'+(p===current?'':'display:none')+'"><header class="paper-head"><div class="date"><span>জাতীয় অনলাইন সংবাদপত্র</span><span>বরগুনা · বাংলাদেশ</span><span>'+new Date().toLocaleDateString('bn-BD')+'</span></div><h1>BD BARGUNA NEWS</h1><p>সত্যের সন্ধানে, মানুষের পাশে।</p><div class="line"></div><div class="date"><span>দৈনিক ই-পেপার</span><span>পৃষ্ঠা '+bn(p+1)+' / '+bn(pages.length)+'</span><span>প্রকাশিত সংবাদ</span></div></header><div class="stories">'+items.map(story).join('')+'</div>'+(p%2===0?'<div class="ad">বিজ্ঞাপন · BD Barguna News</div>':'')+'<footer class="page-foot"><span>BD BARGUNA NEWS · বরগুনা</span><span>পৃষ্ঠা '+bn(p+1)+'</span></footer></section>').join('');thumbs.innerHTML=pages.map((items,p)=>'<button class="thumb '+(p===current?'active':'')+'" data-p="'+p+'">পৃষ্ঠা '+bn(p+1)+'<small>'+bn(items.length)+'টি সংবাদ</small></button>').join('');document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===pages.length-1;thumbs.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{current=+b.dataset.p;render()})}
function change(n){current=Math.max(0,Math.min(pages.length-1,current+n));render()}
document.getElementById('prev').onclick=()=>change(-1);document.getElementById('next').onclick=()=>change(1);
fetch('https://raw.githubusercontent.com/mdsaimoon518-ship-it/BD-Barguna-News/main/news.json?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('সংবাদ পাওয়া যায়নি');return r.json()}).then(items=>{items=Array.isArray(items)?items.filter(x=>x&&x.title):[];items.sort((a,b)=>new Date(b.date||b.publishedAt||0)-new Date(a.date||a.publishedAt||0));for(let i=0;i<items.length;i+=4)pages.push(items.slice(i,i+4));render()}).catch(()=>document.getElementById('pages').innerHTML='<div class="empty">সংবাদ লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে আবার খুলুন।</div>');
</script></body></html>
