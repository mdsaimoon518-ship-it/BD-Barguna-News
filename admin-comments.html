*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#17212b;font-family:Arial,"Noto Sans Bengali",sans-serif;line-height:1.65}.wrap{max-width:900px;margin:auto;padding:16px}.top{background:#18212b;color:white;padding:16px}.top a{color:white;text-decoration:none;font-weight:900;font-size:21px}.panel{background:#fff;border:1px solid #e5e8ee;border-radius:12px;padding:18px;margin:16px 0}.btn{border:0;border-radius:8px;padding:10px 15px;font-weight:800;cursor:pointer;background:#b5122b;color:#fff}.btn.secondary{background:#263746}.btn:disabled{opacity:.5}.muted{color:#667085;font-size:13px}.status{padding:10px;background:#f8fafc;border-radius:8px;margin:10px 0}.comment{border:1px solid #e5e8ee;border-radius:10px;padding:14px;margin:12px 0}.comment p{white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:8px}.approve{background:#137547}.delete{background:#9b1c31}.empty{text-align:center;padding:30px;color:#667085}

</head><body><header class="top"><div class="wrap"><a href="./">BD Barguna News — মন্তব্য নিয়ন্ত্রণ</a></div></header><main class="wrap"><section class="panel"><h2>অ্যাডমিন লগইন</h2><p class="muted">অনুমোদিত Google অ্যাকাউন্ট দিয়ে প্রবেশ করুন।</p><button class="btn" id="login">Google দিয়ে লগইন</button> <button class="btn secondary" id="logout" hidden>লগআউট</button><div class="status" id="status" role="status">লগইন প্রয়োজন।</div></section><section class="panel" id="moderation" hidden><h2>পাঠকের মন্তব্য অনুমোদন</h2><p class="muted">অনুমোদন করলে মন্তব্য ওয়েবসাইটে দেখাবে। মুছে ফেললে আর ফেরত পাওয়া যাবে না।</p><div id="comments"><div class="empty">মন্তব্য লোড হচ্ছে...</div></div></section></main>
<script>
(function(){
const firebaseConfig={apiKey:"AIzaSyAmAyhVJfCRs4AzW_Hs-MxI5ydJzvxRE74",authDomain:"bd-barguna-news.firebaseapp.com",databaseURL:"https://bd-barguna-news-default-rtdb.firebaseio.com",projectId:"bd-barguna-news",storageBucket:"bd-barguna-news.firebasestorage.app",messagingSenderId:"468693004369",appId:"1:468693004369:web:e07e7bb422ec286a53c870"};
const ADMIN_EMAIL="mdsaimoon518@gmail.com";
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.database(),status=document.getElementById('status'),box=document.getElementById('moderation'),list=document.getElementById('comments');
let listener=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits=s=>String(s).replace(/[0-9]/g,d=>'০১২৩৪৫৬৭৮৯'[Number(d)]);
function show(items){if(!items.length){list.innerHTML='<div class="empty">কোনো মন্তব্য পাওয়া যায়নি।</div>';return;}list.innerHTML=items.map(c=>'<article class="comment"><strong>'+esc(c.name||'পাঠক')+'</strong><span class="muted"> • '+esc(c.articleKey)+' • '+esc(c.approved?'অনুমোদিত':'অনুমোদনের অপেক্ষায়')+'</span><p>'+esc(c.text||'')+'</p><div class="muted">'+esc(c.createdAt?new Date(c.createdAt).toLocaleString('bn-BD'):'সময় অজানা')+'</div><div class="actions">'+(!c.approved?'<button class="btn approve" data-action="approve" data-path="'+esc(c.path)+'">অনুমোদন</button>':'')+'<button class="btn delete" data-action="delete" data-path="'+esc(c.path)+'">মুছে ফেলুন</button></div></article>').join('');}
function start(){if(listener)db.ref('articleComments').off('value',listener);listener=snap=>{const items=[];snap.forEach(article=>article.forEach(comment=>items.push({articleKey:article.key,path:article.key+'/'+comment.key,...comment.val()})));items.sort((a,b)=>(Number(b.createdAt)||0)-(Number(a.createdAt)||0));show(items);status.textContent='মন্তব্য পাওয়া গেছে: '+digits(items.length);};db.ref('articleComments').on('value',listener,error=>{status.textContent='ডেটা পড়া যায়নি। Firebase Database Rules পরীক্ষা করুন।';});}
document.getElementById('login').addEventListener('click',async()=>{try{const provider=new firebase.auth.GoogleAuthProvider();await auth.signInWithPopup(provider);}catch(e){status.textContent='লগইন হয়নি: '+e.message+'। Google provider চালু আছে কি না দেখুন।';}});
document.getElementById('logout').addEventListener('click',()=>auth.signOut());
auth.onAuthStateChanged(user=>{const ok=!!user&&user.email===ADMIN_EMAIL&&user.emailVerified===true;document.getElementById('login').hidden=!!user;document.getElementById('logout').hidden=!user;box.hidden=!ok;if(ok){status.textContent='অ্যাডমিন হিসেবে প্রবেশ করেছেন: '+user.email;start();}else{if(listener){db.ref('articleComments').off('value',listener);listener=null;}if(user){status.textContent='এই Google অ্যাকাউন্টের অনুমতি নেই।';auth.signOut();}else status.textContent='লগইন প্রয়োজন।';}});
list.addEventListener('click',async e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const user=auth.currentUser;if(!user||user.email!==ADMIN_EMAIL||!user.emailVerified){status.textContent='অ্যাডমিন অনুমতি নেই।';return;}const path=btn.dataset.path;if(!path||path.includes('..'))return;btn.disabled=true;try{const ref=db.ref('articleComments/'+path);if(btn.dataset.action==='approve')await ref.update({approved:true,moderatedAt:firebase.database.ServerValue.TIMESTAMP,moderatedBy:user.uid});else if(btn.dataset.action==='delete'){if(!confirm('এই মন্তব্যটি স্থায়ীভাবে মুছে ফেলবেন?')){btn.disabled=false;return;}await ref.remove();}status.textContent='পরিবর্তন সংরক্ষিত হয়েছে।';}catch(err){status.textContent='পরিবর্তন হয়নি। Firebase Rules-এ অ্যাডমিন অনুমতি দিন।';btn.disabled=false;}});
})();
</script></body></html>
