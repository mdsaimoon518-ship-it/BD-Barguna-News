

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BD Barguna News Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;padding:20px}
main{max-width:550px;margin:auto;background:white;padding:20px;border-radius:10px}
input,textarea,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0}
button{background:#087b42;color:white;border:0;border-radius:5px}
</style>
</head>
<body>
<main>
<h2>BD Barguna News — Admin Panel</h2>
<form id="newsForm">
<label>সংবাদের শিরোনাম</label>
<input id="title" required>
<label>বিভাগ</label>
<input id="category" placeholder="বরগুনা">
<label>সংবাদের বিবরণ</label>
<textarea id="body" rows="8" required></textarea>
<label>ছবির URL (ঐচ্ছিক)</label>
<input id="image" type="url" placeholder="ছবির সরাসরি লিংক দিন">
<label>অথবা মোবাইল থেকে ছবি আপলোড করুন (সর্বোচ্চ 5 MB)</label>
<input id="imageFile" type="file" accept="image/*">
<label>GitHub Token</label>
<input id="token" type="password" required>
<button type="submit">সংবাদ প্রকাশ করুন</button>
</form>
<p id="status"></p>
<hr style="margin:28px 0;border:0;border-top:1px solid #ddd">
<h2>ভিডিও নিউজ প্রকাশ</h2>
<form id="videoForm">
<label>ভিডিওর শিরোনাম</label>
<input id="videoTitle" required>
<label>YouTube ভিডিও লিংক</label>
<input id="videoUrl" type="url" placeholder="https://www.youtube.com/watch?v=..." required>
<label>প্রকাশের তারিখ (ঐচ্ছিক)</label>
<input id="videoDate" placeholder="আজকের তারিখ স্বয়ংক্রিয় হবে">
<button type="submit">ভিডিও প্রকাশ করুন</button>
</form>
<p style="font-size:13px;color:#667085">উপরের GitHub Token ব্যবহার করেই ভিডিও সংরক্ষিত হবে। টোকেন কোথাও সংরক্ষণ করা হয় না।</p>
</main>
<script>
const owner="mdsaimoon518-ship-it";
const repo="BD-Barguna-News";
const path="news.json";

async function uploadNewsImage(token){
const file=document.getElementById("imageFile").files[0];
if(!file)return document.getElementById("image").value.trim();
if(!file.type.startsWith("image/"))throw new Error("শুধু ছবির ফাইল নির্বাচন করুন।");
if(file.size>5*1024*1024)throw new Error("ছবির আকার 5 MB-এর কম হতে হবে।");
const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
const name="news-"+Date.now()+"."+ext;
const base64=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(new Error("ছবি পড়া যায়নি।"));reader.readAsDataURL(file)});
const headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
const res=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/images/${name}`,{method:"PUT",headers,body:JSON.stringify({message:"Upload news image",content:base64})});
if(!res.ok)throw new Error("ছবি আপলোড হয়নি: "+res.status);
return "images/"+name;
}

document.getElementById("newsForm").addEventListener("submit",async e=>{
e.preventDefault();
const status=document.getElementById("status");
const token=document.getElementById("token").value.trim();
status.textContent="প্রকাশ করা হচ্ছে...";
try{
const headers={
"Authorization":"Bearer "+token,
"Accept":"application/vnd.github+json",
"X-GitHub-Api-Version":"2022-11-28"
};
const url=`https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
const response=await fetch(url,{headers});
if(!response.ok) throw new Error("GitHub ফাইল পড়া যায়নি: "+response.status);
const file=await response.json();
const old=JSON.parse(decodeURIComponent(escape(atob(file.content.replace(/\n/g,"")))));
const imagePath=await uploadNewsImage(token);
old.unshift({
title:document.getElementById("title").value,
category:document.getElementById("category").value,
body:document.getElementById("body").value,
image:imagePath,
date:new Date().toISOString()
});
const content=btoa(unescape(encodeURIComponent(JSON.stringify(old,null,2))));
const save=await fetch(url,{
method:"PUT",headers,
body:JSON.stringify({
message:"Publish news",
content,
sha:file.sha
})
});
if(!save.ok) throw new Error("প্রকাশ হয়নি: "+save.status);
status.textContent="সংবাদ news.json-এ সংরক্ষিত হয়েছে।";
document.getElementById("newsForm").reset();
}catch(err){
status.textContent="সমস্যা: "+err.message;
}
});

document.getElementById("videoForm").addEventListener("submit",async e=>{
e.preventDefault();
const status=document.getElementById("status");
const token=document.getElementById("token").value.trim();
const title=document.getElementById("videoTitle").value.trim();
const videoUrl=document.getElementById("videoUrl").value.trim();
const date=document.getElementById("videoDate").value.trim()||new Date().toLocaleDateString("bn-BD");
if(!token){status.textContent="আগে GitHub Token দিন।";return;}
if(!/(youtube\.com\/watch\?v=|youtu\.be\/)/i.test(videoUrl)){status.textContent="সঠিক YouTube ভিডিও লিংক দিন।";return;}
status.textContent="ভিডিও প্রকাশ করা হচ্ছে...";
try{
const headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"};
const url="https://api.github.com/repos/"+owner+"/"+repo+"/contents/videos.json";
const response=await fetch(url,{headers});
if(!response.ok) throw new Error("ভিডিও ফাইল পড়া যায়নি: "+response.status);
const file=await response.json();
const decoded=decodeURIComponent(escape(atob(file.content.replace(/\n/g,""))));
const videos=JSON.parse(decoded);
videos.unshift({title:title,url:videoUrl,date:date});
const content=btoa(unescape(encodeURIComponent(JSON.stringify(videos,null,2))));
const save=await fetch(url,{method:"PUT",headers,body:JSON.stringify({message:"Publish video news",content:content,sha:file.sha})});
if(!save.ok) throw new Error("ভিডিও প্রকাশ হয়নি: "+save.status);
status.textContent="ভিডিও নিউজ সফলভাবে প্রকাশ হয়েছে। হোমপেজে দেখতে কিছুক্ষণ অপেক্ষা করুন।";
document.getElementById("videoForm").reset();
}catch(err){status.textContent="সমস্যা: "+err.message;}
});
</script>
</body>
</html>
