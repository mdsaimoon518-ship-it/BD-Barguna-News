
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b5122b">
<title>BD Barguna News Admin Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:12px;background:#f1f3f6;font-family:Arial,sans-serif}
main{max-width:720px;margin:auto;background:white;padding:18px;border-radius:12px}
h2,h3{color:#b5122b}
input,textarea,select,button{width:100%;padding:12px;margin:7px 0;font:inherit;border:1px solid #ddd;border-radius:6px}
textarea{min-height:110px}
button{background:#087b42;color:white;border:0;cursor:pointer;font-weight:bold}
button:disabled{opacity:.5}
.blue{background:#175cd3}
.facebook{background:#1877f2}
.whatsapp{background:#128c4a}
.gray{background:#667085}
.red{background:#b42318}
.card{border:1px solid #ddd;padding:12px;border-radius:9px;margin:12px 0}
.card img{width:100%;max-height:220px;object-fit:contain}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.status{overflow-wrap:anywhere}
.note{font-size:13px;color:#667085;line-height:1.6}
hr{border:0;border-top:1px solid #ddd;margin:25px 0}
</style>
</head>
<body>
<main>
<h2>📰 BD Barguna News</h2>
<p>Admin Control Panel</p>

<label>GitHub Token</label>
<input id="token" type="password" autocomplete="off" placeholder="GitHub Token দিন">
<p class="note">Token গোপন রাখবেন। কাউকে পাঠাবেন না।</p>

<hr>
<h3>📝 সংবাদ প্রকাশ</h3>
<form id="newsForm">
<label>সংবাদের শিরোনাম</label>
<input id="title" required>

<label>সংবাদের বিভাগ</label>
<select id="category" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option value="বরগুনা">বরগুনা সংবাদ</option>
<option value="জাতীয়">জাতীয় সংবাদ</option>
<option value="আন্তর্জাতিক">আন্তর্জাতিক সংবাদ</option>
<option value="রাজনীতি">রাজনীতি</option>
<option value="অর্থনীতি">অর্থনীতি</option>
<option value="শিক্ষা">শিক্ষা</option>
<option value="স্বাস্থ্য">স্বাস্থ্য</option>
<option value="অপরাধ">অপরাধ</option>
<option value="খেলাধুলা">খেলাধুলা</option>
<option value="বিনোদন">বিনোদন</option>
<option value="আবহাওয়া">আবহাওয়া</option>
<option value="প্রযুক্তি">তথ্যপ্রযুক্তি</option>
<option value="অন্যান্য">অন্যান্য</option>
</select>

<label>সংবাদের বিবরণ</label>
<textarea id="body" required></textarea>

<label>ছবির URL (ঐচ্ছিক)</label>
<input id="image" type="url" placeholder="https://example.com/photo.jpg">

<label>মোবাইল থেকে ছবি আপলোড (সর্বোচ্চ 5 MB)</label>
<input id="imageFile" type="file" accept="image/*">

<label>ছবির ক্যাপশন</label>
<input id="caption" placeholder="ছবি: BD Barguna News">

<button id="publishBtn" type="submit">সংবাদ প্রকাশ করুন</button>
<button id="cancelEdit" type="button" class="gray" hidden>এডিট বাতিল</button>
</form>
<p id="status" class="status"></p>

<hr>
<h3>📚 প্রকাশিত সংবাদ পরিচালনা</h3>
<button id="loadNews" class="blue" type="button">সংবাদের তালিকা দেখুন</button>
<div id="newsList"></div>

<hr>
<h3>🎥 ভিডিও নিউজ প্রকাশ</h3>
<form id="videoForm">
<label>ভিডিওর শিরোনাম</label>
<input id="videoTitle" required>
<label>YouTube ভিডিও লিংক</label>
<input id="videoUrl" type="url" required placeholder="YouTube URL">
<button type="submit">ভিডিও প্রকাশ করুন</button>
</form>
<p id="videoStatus" class="status"></p>
<button id="loadVideos" type="button" class="blue">ভিডিও তালিকা দেখুন</button>
<div id="videoList"></div>

<hr>
<p class="note">BD Barguna News | সত্যের সন্ধানে, মানুষের পাশে।</p>
</main>

<script>
"use strict";

const OWNER="mdsaimoon518-ship-it";
const REPO="BD-Barguna-News";
const BRANCH="main";
const NEWS="news.json";
const VIDEOS="videos.json";

const $=id=>document.getElementById(id);
let cachedNews=[];
let editingSlug=null;

function getHeaders(){
 const t=$("token").value.trim();
 if(!t)throw new Error("GitHub Token দিন");
 return {
  Authorization:"Bearer "+t,
  Accept:"application/vnd.github+json",
  "X-GitHub-Api-Version":"2022-11-28"
 };
}

function api(path){
 return "https://api.github.com/repos/"+OWNER+"/"+REPO+
 "/contents/"+path.split("/").map(encodeURIComponent).join("/");
}

function encode64(str){
 const bytes=new TextEncoder().encode(str);
 let binary="";
 for(let i=0;i<bytes.length;i+=8192)
  binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
 return btoa(binary);
}

function decode64(str){
 const binary=atob(str.replace(/\s/g,""));
 return new TextDecoder().decode(
  Uint8Array.from(binary,c=>c.charCodeAt(0))
 );
}

async function readFile(path){
 const r=await fetch(api(path),{headers:getHeaders(),cache:"no-store"});
 if(r.status===404)return {data:null,sha:null};
 if(!r.ok)throw new Error(await errorText(r));
 const d=await r.json();
 return {data:decode64(d.content),sha:d.sha};
}

async function errorText(r){
 let msg="GitHub Error "+r.status;
 try{msg+=": "+(await r.json()).message}catch(e){}
 return msg;
}

async function saveFile(path,content,message){
 const old=await readFile(path);
 const payload={
  message,
  content:encode64(content),
  branch:BRANCH
 };
 if(old.sha)payload.sha=old.sha;

 const r=await fetch(api(path),{
  method:"PUT",
  headers:{...getHeaders(),"Content-Type":"application/json"},
  body:JSON.stringify(payload)
 });
 if(!r.ok)throw new Error(await errorText(r));
 return r.json();
}

async function removeFile(path){
 const old=await readFile(path);
 if(!old.sha)return;
 const r=await fetch(api(path),{
  method:"DELETE",
  headers:{...getHeaders(),"Content-Type":"application/json"},
  body:JSON.stringify({
   message:"Delete article",
   sha:old.sha,
   branch:BRANCH
  })
 });
 if(!r.ok)throw new Error(await errorText(r));
}

async function readJSON(path){
 const f=await readFile(path);
 if(!f.data)return [];
 const data=JSON.parse(f.data);
 if(!Array.isArray(data))throw new Error("JSON ফাইলের ফরম্যাট ভুল");
 return data;
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function makeSlug(s){
 return s.toLowerCase().replace(/[^\u0980-\u09ffa-z0-9]+/g,"-")
 .replace(/^-+|-+$/g,"").slice(0,60)+"-"+Date.now();
}

function show(id,msg,error=false){
 $(id).textContent=msg;
 $(id).style.color=error?"#b42318":"#087b42";
}

function articleUrl(n){
 return new URL("../articles/"+encodeURIComponent(n.slug)+".html",location.href).href;
}

async function uploadImage(file){
 if(!file)return "";
 if(!file.type.startsWith("image/"))throw new Error("ছবি নির্বাচন সঠিক নয়");
 if(file.size>5*1024*1024)throw new Error("ছবি 5 MB-এর বেশি");

 const base=await new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(String(r.result).split(",")[1]);
  r.onerror=()=>reject(new Error("ছবি পড়া যায়নি"));
  r.readAsDataURL(file);
 });

 const ext=(file.name.split(".").pop()||"jpg")
 .toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
 const path="images/news/news-"+Date.now()+"."+ext;

 const r=await fetch(api(path),{
  method:"PUT",
  headers:{...getHeaders(),"Content-Type":"application/json"},
  body:JSON.stringify({
   message:"Upload news photo",
   content:base,
   branch:BRANCH
  })
 });
 if(!r.ok)throw new Error(await errorText(r));
 return path;
}

function articleHTML(n){
 const image=n.image?
 `<div class="photo-card">
 <img src="${/^https?:\/\//i.test(n.image)?esc(n.image):"../"+esc(n.image).replace(/^\/+/,"")}" alt="${esc(n.title)}">
 <div class="caption">${esc(n.caption||"ছবি: BD Barguna News")}</div>
 </div>`:"";

 const date=new Date(n.date);
 const dateText=Number.isNaN(date.getTime())?esc(n.date):
 date.toLocaleString("bn-BD",{dateStyle:"long",timeStyle:"short"});

 return `<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="${esc(n.body.slice(0,150))}">
<title>${esc(n.title)} | BD Barguna News</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 10px;background:#eef1f5;color:#202936;font-family:Arial,sans-serif;line-height:1.9}
.paper{max-width:850px;margin:auto;background:white;padding:25px;border:1px solid #ddd;border-radius:12px;box-shadow:0 4px 20px #0001}
.masthead{display:flex;align-items:center;gap:14px;border-bottom:4px solid #b5122b;padding-bottom:15px}
.logo{width:65px;height:65px;object-fit:contain}
.brand{color:#b5122b;font-size:24px;font-weight:bold;margin:0}
.tagline{font-size:13px;color:#667085;margin:0}
.category{display:inline-block;background:#fff0f1;color:#b5122b;padding:5px 13px;border-radius:20px;margin-top:20px}
h1{font-size:30px;line-height:1.5}
.date{color:#667085;border-bottom:1px solid #ddd;padding-bottom:14px}
.photo-card{margin:22px 0;padding:10px;border:1px solid #ddd;border-radius:12px;background:#fafafa}
.photo-card img{display:block;width:100%;max-height:480px;object-fit:contain;border-radius:8px}
.caption{text-align:center;color:#667085;font-size:13px;padding-top:9px}
.article{white-space:pre-wrap;overflow-wrap:anywhere;text-align:justify;font-size:18px}
.footer{text-align:center;border-top:3px solid #b5122b;margin-top:30px;padding-top:14px;color:#667085}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
button{padding:11px 18px;border:0;border-radius:6px;color:white;background:#087b42}
.facebook{background:#1877f2}.whatsapp{background:#128c4a}
@media(max-width:500px){.paper{padding:15px}h1{font-size:23px}.brand{font-size:20px}.article{font-size:16px}}
@media print{body{background:white;padding:0}.paper{box-shadow:none;border:0;padding:0}.buttons,.home{display:none!important}}
</style>
</head>
<body>
<main class="paper">
<header class="masthead">
<img class="logo" src="../images/app-icon.svg" alt="BD Barguna News Logo">
<div>
<p class="brand">BD Barguna News</p>
<p class="tagline">সত্যের সন্ধানে, মানুষের পাশে।</p>
</div>
</header>
<div class="category">${esc(n.category)}</div>
<h1>${esc(n.title)}</h1>
<div class="date">📅 প্রকাশিত: ${dateText}</div>
${image}
<div class="article">${esc(n.body)}</div>
<footer class="footer">
<strong>BD Barguna News</strong><br>
সত্যের সন্ধানে, মানুষের পাশে।
</footer>
<div class="buttons">
<button onclick="window.print()">🖨️ সংবাদ প্রিন্ট</button>
<button class="facebook" onclick="window.open('https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(location.href),'_blank','noopener')">Facebook শেয়ার</button>
<button class="whatsapp" onclick="window.open('https://wa.me/?text='+encodeURIComponent(document.title+' '+location.href),'_blank','noopener')">WhatsApp শেয়ার</button>
</div>
<p class="home"><a href="../">প্রচ্ছদে ফিরে যান</a></p>
</main>
</body>
</html>`;
}

async function loadNews(){
 $("newsList").textContent="সংবাদ লোড হচ্ছে...";
 try{
  cachedNews=await readJSON(NEWS);
  if(!cachedNews.length){
   $("newsList").textContent="কোনো সংবাদ পাওয়া যায়নি।";
   return;
  }
  $("newsList").innerHTML=cachedNews.map((n,i)=>`
   <div class="card">
   <strong>${esc(n.title)}</strong>
   <p>${esc(n.category)} | ${esc(n.date)}</p>
   ${n.image?`<img src="${/^https?:\/\//i.test(n.image)?esc(n.image):"../"+esc(n.image)}" alt="সংবাদ ছবি">`:""}
   <div class="actions">
   <button class="blue" data-a="edit" data-i="${i}">এডিট</button>
   <button class="red" data-a="delete" data-i="${i}">ডিলিট</button>
   <button class="gray" data-a="copy" data-i="${i}">লিংক কপি</button>
   <button class="facebook" data-a="facebook" data-i="${i}">Facebook</button>
   <button class="whatsapp" data-a="whatsapp" data-i="${i}">WhatsApp</button>
   <button data-a="print" data-i="${i}">সংবাদ প্রিন্ট</button>
   </div></div>`).join("");
 }catch(e){$("newsList").textContent=e.message}
}

$("newsList").addEventListener("click",async e=>{
 const b=e.target.closest("button[data-a]");
 if(!b)return;
 const n=cachedNews[Number(b.dataset.i)];
 if(!n)return;
 const url=articleUrl(n);

 try{
  switch(b.dataset.a){
   case "edit":
    $("title").value=n.title;
    $("category").value=n.category;
    $("body").value=n.body;
    $("image").value=/^https?:\/\//i.test(n.image||"")?n.image:"";
    $("caption").value=n.caption||"";
    editingSlug=n.slug;
    $("publishBtn").textContent="সংবাদ আপডেট করুন";
    $("cancelEdit").hidden=false;
    window.scrollTo({top:0,behavior:"smooth"});
    break;
   case "delete":
    if(!confirm("এই সংবাদ ডিলিট করবেন?"))return;
    b.disabled=true;
    const latest=await readJSON(NEWS);
    await saveFile(NEWS,JSON.stringify(latest.filter(x=>x.slug!==n.slug),null,2),"Delete news");
    await removeFile("articles/"+n.slug+".html");
    show("status","সংবাদ ডিলিট হয়েছে");
    await loadNews();
    break;
   case "copy":
    await navigator.clipboard.writeText(url);
    alert("লিংক কপি হয়েছে");
    break;
   case "facebook":
    window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(url),"_blank");
    break;
   case "whatsapp":
    window.open("https://wa.me/?text="+encodeURIComponent(n.title+" "+url),"_blank");
    break;
   case "print":
    window.open(url,"_blank");
    break;
  }
 }catch(err){alert(err.message);b.disabled=false}
});

$("cancelEdit").onclick=()=>{
 editingSlug=null;
 $("newsForm").reset();
 $("publishBtn").textContent="সংবাদ প্রকাশ করুন";
 $("cancelEdit").hidden=true;
};

$("newsForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=$("publishBtn");
 btn.disabled=true;
 show("status","সংবাদ প্রকাশ হচ্ছে...");
 try{
  const title=$("title").value.trim();
  const category=$("category").value;
  const body=$("body").value.trim();
  const latest=await readJSON(NEWS);
  const old=editingSlug?latest.find(x=>x.slug===editingSlug):null;
  if(editingSlug&&!old)throw new Error("সম্পাদনার সংবাদ পাওয়া যায়নি");

  let image=$("image").value.trim()||old?.image||"";
  if($("imageFile").files[0])
   image=await uploadImage($("imageFile").files[0]);

  const n={
   title,category,body,image,
   caption:$("caption").value.trim(),
   date:old?.date||new Date().toISOString(),
   slug:old?.slug||makeSlug(title)
  };

  const updated=old
   ?latest.map(x=>x.slug===editingSlug?n:x)
   :[n,...latest];

  await saveFile("articles/"+n.slug+".html",articleHTML(n),"Publish article page");
  await saveFile(NEWS,JSON.stringify(updated,null,2),old?"Update news":"Publish news");

  editingSlug=null;
  $("newsForm").reset();
  $("publishBtn").textContent="সংবাদ প্রকাশ করুন";
  $("cancelEdit").hidden=true;
  show("status","সফল! সংবাদ ও HTML পেজ প্রকাশ হয়েছে।");
  await loadNews();
 }catch(err){show("status","সমস্যা: "+err.message,true)}
 finally{btn.disabled=false}
});

$("loadNews").onclick=loadNews;

/* VIDEO NEWS */

async function loadVideos(){
 try{
  const videos=await readJSON(VIDEOS);
  $("videoList").innerHTML=videos.length?videos.map(v=>`
   <div class="card"><strong>${esc(v.title)}</strong>
   <p><a href="${esc(v.url)}" target="_blank" rel="noopener">ভিডিও দেখুন</a></p></div>
  `).join(""):"কোনো ভিডিও নেই";
 }catch(e){$("videoList").textContent=e.message}
}

$("loadVideos").onclick=loadVideos;

$("videoForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const btn=e.submitter;
 btn.disabled=true;
 try{
  const title=$("videoTitle").value.trim();
  const url=$("videoUrl").value.trim();
  const u=new URL(url);
  if(!["youtube.com","www.youtube.com","youtu.be","m.youtube.com"].includes(u.hostname))
   throw new Error("সঠিক YouTube URL দিন");
  const videos=await readJSON(VIDEOS);
  videos.unshift({title,url,date:new Date().toISOString()});
  await saveFile(VIDEOS,JSON.stringify(videos,null,2),"Publish video news");
  $("videoForm").reset();
  show("videoStatus","ভিডিও নিউজ প্রকাশ হয়েছে");
  await loadVideos();
 }catch(err){show("videoStatus",err.message,true)}
 finally{btn.disabled=false}
});
</script>
</body>
</html>
